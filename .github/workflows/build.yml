name: Build Eaglercraft 26.2

# Builds Eaglercraft 26.2 into one standalone HTML file.
# Step 1 (now): plain 26.2, to prove the build works on GitHub's machines.
# Step 2 (next): the Fabric mods in mods/ are woven into the game during this build.

on:
  push:
    branches: [main]
    paths: ["mods/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  # The Eaglercraft 26.2 workspace is downloaded at build time and never committed here.
  WORKSPACE_REPO: https://github.com/kingjoeishere/Eaglercraft-26.2-Workspace
  WORKSPACE_COMMIT: f73bff91f0f0840bc958c09ab536dbba1e146b2e

jobs:
  build:
    runs-on: ubuntu-latest   # public repos: 4 cores, 16 GB RAM
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2 || true
          free -h; df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download the Eaglercraft 26.2 workspace
        run: |
          git init -q workspace
          cd workspace
          git remote add origin "$WORKSPACE_REPO"
          git fetch -q --depth 1 origin "$WORKSPACE_COMMIT"
          git checkout -q FETCH_HEAD
          chmod +x gradlew

      - name: Build the standalone HTML
        working-directory: workspace
        env:
          EAGLER_BUILD_CAP_MIB: "13312"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          mkdir -p ../out
          node wasm-toolchain/build-single-html.js --output ../out/eaglercraft-26.2.html

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2
          path: out/
          retention-days: 14

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/* --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}. Mods: $(ls mods | tr '\n' ' ')" --latest
